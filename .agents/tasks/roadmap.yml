version: 1
product: Spill
direction: compact macOS control tray
status_legend:
  done: implemented and verified in a completed run.
  partial: implemented enough to use, but still needs follow-up polish or visual verification.
  next: recommended near-term work.
  pending: planned but not started.
  deferred: valid idea, intentionally not in the near-term path.

milestones:
  - id: M0
    name: Direction reset
    goal: Remove fragile spacer behavior and align app with PRD.
    tasks:
      - id: M0-T1
        title: Remove spacer status item
        state: done
        acceptance:
          - StatusItemController creates exactly one NSStatusItem.
          - No status item length depends on notch width.
          - swift build passes.
      - id: M0-T2
        title: Update README positioning
        state: done
        acceptance:
          - README explains public API limitations.
          - README describes Spill as a compact control tray.
      - id: M0-T3
        title: Add runtime smoke verification
        state: done
        acceptance:
          - Bundled app can launch in smoke mode.
          - Smoke mode verifies readiness and clean shutdown.
          - Smoke mode does not request Accessibility permission.

  - id: M1
    name: Compact panel shell
    goal: Rework panel into status/action tray.
    tasks:
      - id: M1-T1
        title: Add panel section model
        state: partial
        acceptance:
          - Panel can render status strip, AI strip, actions, and window actions.
      - id: M1-T2
        title: Clean panel visuals
        state: done
        acceptance:
          - No nested cards.
          - Compact height target is preserved.
      - id: M1-T3
        title: Add visual panel verification
        state: partial
        acceptance:
          - A repeatable verification path confirms the panel opens with readable compact layout.
          - Footer status values do not overflow.
          - Results are documented in a run closeout.
      - id: M1-T4
        title: Add pixel or accessibility-tree visual regression check
        state: done
        acceptance:
          - Panel layout smoke collects panel accessibility labels and fails on missing key labels.
          - The check does not require unreliable manual permission setup.
          - Pixel-level overlap remains a documented future enhancement.

  - id: M2
    name: Providers
    goal: Introduce provider model layer.
    tasks:
      - id: M2-T1
        title: Add status/action data models
        state: done
        acceptance:
          - SwiftUI views consume plain models.
      - id: M2-T2
        title: Add provider protocol or structs
        state: done
        acceptance:
          - Providers are isolated from panel layout.
      - id: M2-T3
        title: Add provider refresh store
        state: done
        acceptance:
          - SwiftUI views consume cached provider state.
          - Expensive providers are not read directly during view rendering.
          - Refresh cadence is explicit and testable.
      - id: M2-T4
        title: Add configurable status modules
        state: done
        acceptance:
          - Compact status modules can be enabled or disabled.
          - Compact status modules can be reordered.
          - Disabled modules do not run provider refresh work.

  - id: M3
    name: System strip
    goal: Add basic Mac status signals.
    tasks:
      - id: M3-T1
        title: Memory status
        state: done
        acceptance:
          - Memory usage displays as a compact pill.
      - id: M3-T2
        title: CPU status
        state: done
        acceptance:
          - CPU usage displays without blocking UI.
          - CPU provider foundation is implemented.
          - CPU visibility and order follow compact status module settings.
      - id: M3-T3
        title: Battery status
        state: done
        acceptance:
          - Battery percent/state displays when available.
      - id: M3-T5
        title: Power footer visibility
        state: done
        acceptance:
          - Power footer can be hidden by user setting.
          - Hidden power footer state does not run the power reader.
      - id: M3-T4
        title: Network status
        state: done
        acceptance:
          - Network availability displays when available.
      - id: M3-T6
        title: Status detail and menu bar values
        state: done
        acceptance:
          - Status pills expose detailed readings on click.
          - CPU and memory values can be shown or hidden in the menu bar from the panel.
          - CPU and memory use compact percentage values in the menu bar and richer detail in the panel.
      - id: M3-T7
        title: Legacy GPU availability
        state: deferred
        acceptance:
          - GPU is not a primary panel status because the value is low for the compact tray.
          - Existing provider code can remain as legacy implementation until a stronger GPU use case exists.
      - id: M3-T8
        title: Storage status and compact graphs
        state: done
        acceptance:
          - Storage replaces GPU in the primary panel status area.
          - CPU, memory, and storage render as three compact rows.
          - Each primary row has bounded sparkline history.
          - Metric refresh is independent from AX menu bar scan cadence.

  - id: M4
    name: AI strip
    goal: Add local AI/tooling state.
    tasks:
      - id: M4-T1
        title: Codex state
        state: done
        acceptance:
          - Detects obvious local Codex process/session state when available.
      - id: M4-T2
        title: Ollama state
        state: done
        acceptance:
          - Detects Ollama running/not running without network dependency.
      - id: M4-T3
        title: OpenAI config state
        state: done
        acceptance:
          - Shows configured/missing without exposing secrets.
      - id: M4-T4
        title: AI menu bar summary
        state: pending
        acceptance:
          - Reliable AI active usage detection is defined before adding a menu bar summary.
          - AI summary does not expose secret values if this later ships.
      - id: M4-T5
        title: Local token metering queue
        state: partial
        acceptance:
          - Local token metering uses an app-owned queue directory instead of a required local server.
          - Dashboard filters usage by safe AI tool, task, stage, source, and period labels.
          - Runtime hooks and adapters do not infer workflow labels from private transcript text, commands, logs, or source files.
      - id: M4-T6
        title: Token session display names
        state: next
        acceptance:
          - Session rows do not expose raw opaque ids as if they were human-readable names.
          - Users can choose or assign a safe local display-name source for run groups.
          - Session names are never inferred from prompts, file paths, repo names, branches, tickets, logs, diffs, or transcript text.

  - id: M5
    name: Actions
    goal: Make stored actions reliable and understandable.
    tasks:
      - id: M5-T1
        title: Pinned actions UI
        state: done
        acceptance:
          - Pin/unpin works.
          - Pinned actions render prominently.
      - id: M5-T2
        title: Action execution result
        state: done
        acceptance:
          - Success/failure/permission states are visible.
      - id: M5-T3
        title: App activation fallback
        state: done
        acceptance:
          - Stale AX item can fallback to opening/activating app.
      - id: M5-T4
        title: Time-based Sleep Guard
        state: done
        acceptance:
          - Sleep Guard is off by default.
          - User selects a fixed duration before assertion creation.
          - Stop and expiry release power assertions.
      - id: M5-T5
        title: Settings item removal
        state: done
        acceptance:
          - Removed detected items are hidden from Spill action surfaces.
          - Hidden state persists separately from selected item state.
          - Hidden detected items can be added again from Preferences.

  - id: M6
    name: Window quick actions
    goal: Add small Rectangle-like action row.
    tasks:
      - id: M6-T1
        title: Focused window frame operations
        state: done
        acceptance:
          - Left/right/center/maximize work on normal windows.
      - id: M6-T2
        title: Next display
        state: done
        acceptance:
          - Active window can move to next display when multiple displays exist.
      - id: M6-T3
        title: Restore frame
        state: done
        acceptance:
          - Previous frame restores best-effort.

  - id: M7
    name: Distribution
    goal: Prepare open-source release path.
    tasks:
      - id: M7-T1
        title: Bundle metadata and icon
        state: pending
        acceptance:
          - App bundle has production metadata.
      - id: M7-T2
        title: Signing and notarization docs
        state: pending
        acceptance:
          - Developer ID release checklist exists.
      - id: M7-T3
        title: DMG or zip release artifact
        state: pending
        acceptance:
          - Release artifact can be created locally.
