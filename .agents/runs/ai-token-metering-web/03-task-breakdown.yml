feature_id: ai-token-metering-web
status: ready

necessity:
  decision: build
  reason: >
    The feature gives AI-heavy Spill users local-first token cost attribution and
    an optional account dashboard without collecting sensitive content.
  ambiguity:
    clarity: clear
    blockers_resolved: true
    resolution_sources:
      - maintainer
      - repo-research
      - assumption
  clarification_required: false
  questions: []

tasks:
  - id: ai-token-metering-web-T1
    title: Write feature intake, PRD, ARD, task breakdown, and agent briefs
    owner_role: coordinator
    state: done
    depends_on: []
    write_scope:
      - .agents/runs/ai-token-metering-web/00-intake.md
      - .agents/runs/ai-token-metering-web/01-prd.md
      - .agents/runs/ai-token-metering-web/02-ard.md
      - .agents/runs/ai-token-metering-web/03-task-breakdown.yml
      - .agents/runs/ai-token-metering-web/04-agent-briefs.md
    read_scope:
      - AGENTS.md
      - VIBEGUARD.md
      - .agents/README.md
      - .agents/specs/prd.md
      - .agents/specs/ard.md
      - .agents/workflows/implementation.md
      - .agents/workflows/ambiguity-gate.md
      - .agents/workflows/multi-agent.md
    forbidden_scope:
      - Sources/Spill/**
      - docs/**
      - web/**
    acceptance:
      - Intake records Decision build and clarity clear.
      - PRD covers local-only, login, cloud sync, detailed opt-in, token-only payloads, and forbidden fields.
      - ARD scopes web as a cloud dashboard preview and defers production auth/database.
    verification:
      commands:
        - python3 .agents/scripts/workflow.py run-gates
        - git diff --check
      manual:
        - Review docs for unresolved blockers and forbidden content collection.

  - id: ai-token-metering-web-T2
    title: Build cloud React dashboard preview under web/
    owner_role: sub-agent-builder
    state: done
    depends_on:
      - ai-token-metering-web-T1
    write_scope:
      - web/**
    read_scope:
      - .agents/runs/ai-token-metering-web/01-prd.md
      - .agents/runs/ai-token-metering-web/02-ard.md
      - .agents/runs/ai-token-metering-web/04-agent-briefs.md
    forbidden_scope:
      - Sources/Spill/**
      - docs/**
      - .agents/runs/ai-token-metering-web/**
      - Package.swift
      - Package.resolved
    acceptance:
      - web/ contains a React dashboard runnable locally without production credentials.
      - Dashboard uses safe fixture/development data only until auth/backend exist.
      - Dashboard renders sync mode status, token KPIs, task breakdown, source hotspots, session trace, and privacy contract.
      - Dashboard keeps core overview visible while session/privacy details can collapse and expand.
      - Sync-safe usage event model excludes prompt, command, response, file path, repo name, diff, log, terminal output, source content, and environment fields.
      - No production auth/database credentials or analytics SDKs are added.
    verification:
      commands:
        - npm test
        - npm run build
      manual:
        - Inspect dashboard at desktop and narrow viewport.
        - Confirm cloud UI is presented as future-gated, not production active or local-dashboard active.

  - id: ai-token-metering-web-T3
    title: Review, verify, and close out the cloud preview web slice
    owner_role: coordinator
    state: done
    depends_on:
      - ai-token-metering-web-T2
    write_scope:
      - .agents/runs/ai-token-metering-web/05-verification.md
      - .agents/runs/ai-token-metering-web/06-closeout.md
    read_scope:
      - web/**
      - .agents/runs/ai-token-metering-web/**
    forbidden_scope:
      - Sources/Spill/**
      - docs/**
    acceptance:
      - Final diff matches PRD/ARD scope.
      - Required checks and VibeGuard audit are recorded.
      - UI verification result and residual risks are documented.
    verification:
      commands:
        - git diff --check
        - npm run build
        - npx --yes @taehwandev/vibeguard audit . --rules "${AGENTPLAYBOOK_HOME:-$HOME/Documents/KeyFlowVault/AgentPlaybook}"
      manual:
        - Run the web dev server and inspect the cloud preview dashboard.

parallel_groups:
  - id: docs-then-web
    tasks:
      - ai-token-metering-web-T1
      - ai-token-metering-web-T2
      - ai-token-metering-web-T3
    rule: Tasks are serialized except T2 may be delegated after PRD/ARD are stable because its write scope is only web/**.
