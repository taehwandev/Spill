name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_count:
        description: "Per-week release count. Version becomes ISO-year.ISO-week.count, for example 2026.20.1"
        required: false
        default: "1"
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-latest

    env:
      SPILL_BUNDLE_ID: dev.spill.Spill
      MANUAL_RELEASE_COUNT: ${{ github.event.inputs.release_count }}
      PUBLISH_DRAFT: ${{ github.event.inputs.draft }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_pattern='^[0-9]{4}\.[0-9]{2}\.[0-9]+$'

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          else
            release_count="${MANUAL_RELEASE_COUNT:-1}"
            if ! [[ "$release_count" =~ ^[1-9][0-9]*$ ]]; then
              echo "release_count must be a positive integer." >&2
              exit 2
            fi

            year="$(date -u +%G)"
            week="$(date -u +%V)"
            version="$year.$week.$release_count"
            tag="v$version"
          fi

          if ! [[ "$version" =~ $version_pattern ]]; then
            echo "Release version must use ISO-year.ISO-week.count, for example 2026.20.1." >&2
            exit 2
          fi

          build="${version##*.}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Prepare Developer ID signing
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$CERTIFICATE_BASE64" && -z "$CERTIFICATE_PASSWORD" && -z "$CODESIGN_IDENTITY" ]]; then
            echo "sign_identity=-" >> "$GITHUB_OUTPUT"
            echo "signing_note=Ad-hoc signed. Gatekeeper warnings can appear." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$CODESIGN_IDENTITY" ]]; then
            echo "Developer ID signing requires MACOS_DEVELOPER_ID_CERTIFICATE_BASE64, MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD, and MACOS_CODESIGN_IDENTITY." >&2
            exit 2
          fi

          keychain_password="${KEYCHAIN_PASSWORD:-temporary-spill-keychain-password}"
          keychain_path="$RUNNER_TEMP/spill-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id.p12"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          printf "%s" "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"

          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          echo "sign_identity=$CODESIGN_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signing_note=Developer ID signed and notarized." >> "$GITHUB_OUTPUT"

      - name: Verify release signing and notarization environment
        shell: bash
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_NOTARYTOOL_API_KEY: ${{ secrets.APPLE_NOTARYTOOL_API_KEY }}
          APPLE_NOTARYTOOL_API_KEY_ID: ${{ secrets.APPLE_NOTARYTOOL_API_KEY_ID }}
          APPLE_NOTARYTOOL_API_ISSUER: ${{ secrets.APPLE_NOTARYTOOL_API_ISSUER }}
        run: node scripts/verify-release-env.mjs

      - name: Prepare Sparkle signing
        id: sparkle
        shell: bash
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" || -z "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo "Official releases require both SPARKLE_PUBLIC_ED_KEY and SPARKLE_PRIVATE_ED_KEY for in-app updates." >&2
            exit 2
          fi

          private_key_file="$RUNNER_TEMP/sparkle_ed_private_key"
          printf "%s" "$SPARKLE_PRIVATE_ED_KEY" > "$private_key_file"
          chmod 600 "$private_key_file"

          echo "private_key_file=$private_key_file" >> "$GITHUB_OUTPUT"
          echo "sparkle_note=Sparkle in-app updates enabled." >> "$GITHUB_OUTPUT"

      - name: Build signed app bundle
        shell: bash
        env:
          SPILL_VERSION: ${{ steps.version.outputs.version }}
          SPILL_BUILD: ${{ steps.version.outputs.build }}
          SPILL_BUNDLE_ID: ${{ env.SPILL_BUNDLE_ID }}
          SPILL_SIGN_IDENTITY: ${{ steps.signing.outputs.sign_identity }}
          SPILL_APTABASE_APP_KEY: ${{ secrets.SPILL_APTABASE_APP_KEY }}
          SPILL_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPILL_BUILD_PRIVATE_USAGE_FEATURE_ENABLED: "0"
          SPILL_BUILD_PRIVATE_USAGE_ENVIRONMENT: production
          SPILL_BUILD_PRIVATE_USAGE_RELAY_URL: ${{ vars.SPILL_BUILD_PRIVATE_USAGE_RELAY_URL }}
          SPILL_BUILD_PRIVATE_USAGE_WEB_URL: ${{ vars.SPILL_BUILD_PRIVATE_USAGE_WEB_URL }}
        run: ./scripts/build-app.sh

      - name: Notarize signed app bundle
        shell: bash
        env:
          APPLE_NOTARYTOOL_API_KEY: ${{ secrets.APPLE_NOTARYTOOL_API_KEY }}
          APPLE_NOTARYTOOL_API_KEY_ID: ${{ secrets.APPLE_NOTARYTOOL_API_KEY_ID }}
          APPLE_NOTARYTOOL_API_ISSUER: ${{ secrets.APPLE_NOTARYTOOL_API_ISSUER }}
        run: ./scripts/notarize-release-artifacts.sh --app .build/Spill.app

      - name: Package release
        shell: bash
        env:
          SPILL_VERSION: ${{ steps.version.outputs.version }}
          SPILL_BUILD: ${{ steps.version.outputs.build }}
          SPILL_BUNDLE_ID: ${{ env.SPILL_BUNDLE_ID }}
          SPILL_SIGN_IDENTITY: ${{ steps.signing.outputs.sign_identity }}
          SPILL_SKIP_BUILD: "1"
          SPILL_APTABASE_APP_KEY: ${{ secrets.SPILL_APTABASE_APP_KEY }}
          SPILL_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPILL_BUILD_PRIVATE_USAGE_FEATURE_ENABLED: "0"
          SPILL_BUILD_PRIVATE_USAGE_ENVIRONMENT: production
          SPILL_BUILD_PRIVATE_USAGE_RELAY_URL: ${{ vars.SPILL_BUILD_PRIVATE_USAGE_RELAY_URL }}
          SPILL_BUILD_PRIVATE_USAGE_WEB_URL: ${{ vars.SPILL_BUILD_PRIVATE_USAGE_WEB_URL }}
        run: ./scripts/package-release.sh

      - name: Notarize packaged artifacts
        shell: bash
        env:
          APPLE_NOTARYTOOL_API_KEY: ${{ secrets.APPLE_NOTARYTOOL_API_KEY }}
          APPLE_NOTARYTOOL_API_KEY_ID: ${{ secrets.APPLE_NOTARYTOOL_API_KEY_ID }}
          APPLE_NOTARYTOOL_API_ISSUER: ${{ secrets.APPLE_NOTARYTOOL_API_ISSUER }}
        run: ./scripts/notarize-release-artifacts.sh --artifacts .build/release-artifacts

      - name: Prepare public release assets
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY_FILE: ${{ steps.sparkle.outputs.private_key_file }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          artifacts_dir=".build/release-artifacts"
          appcast_input_dir="$artifacts_dir/appcast-input"
          download_base_url="https://github.com/taehwandev/Spill/releases/latest/download"
          release_notes_url="https://github.com/taehwandev/Spill/releases/latest"

          cp "$artifacts_dir/Spill-$version-macos.dmg" "$artifacts_dir/Spill-macos.dmg"

          generate_appcast="$(find .build/artifacts/sparkle -path "*/bin/generate_appcast" -type f -print -quit)"
          if [[ -z "$generate_appcast" || ! -x "$generate_appcast" ]]; then
            echo "Sparkle generate_appcast was not found." >&2
            exit 2
          fi

          rm -rf "$appcast_input_dir"
          mkdir -p "$appcast_input_dir"
          cp "$artifacts_dir/Spill-macos.dmg" "$appcast_input_dir/"

          "$generate_appcast" \
            --ed-key-file "$SPARKLE_PRIVATE_KEY_FILE" \
            --download-url-prefix "$download_base_url/" \
            --full-release-notes-url "$release_notes_url" \
            --maximum-versions 1 \
            "$appcast_input_dir"

          cp "$appcast_input_dir/appcast.xml" "$artifacts_dir/appcast.xml"

          (
            cd "$artifacts_dir"
            checksum_files=(Spill-macos.dmg update.json appcast.xml)
            shasum -a 256 "${checksum_files[@]}" > checksums.txt
          )

      - name: Verify packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          codesign --verify --deep --strict --verbose=2 .build/Spill.app
          hdiutil verify ".build/release-artifacts/Spill-$version-macos.dmg"
          hdiutil verify ".build/release-artifacts/Spill-macos.dmg"
          if [[ -f ".build/release-artifacts/appcast.xml" ]]; then
            test -s ".build/release-artifacts/appcast.xml"
            grep -q "<rss" ".build/release-artifacts/appcast.xml"
          fi

          spctl --assess --type execute --verbose=4 .build/Spill.app
          xcrun stapler validate ".build/release-artifacts/Spill-$version-macos.dmg"
          xcrun stapler validate ".build/release-artifacts/Spill-macos.dmg"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Spill-${{ steps.version.outputs.version }}-macos
          path: |
            .build/release-artifacts/Spill-macos.dmg
            .build/release-artifacts/update.json
            .build/release-artifacts/appcast.xml
            .build/release-artifacts/checksums.txt
            .build/release-artifacts/notarytool-logs/**

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_NOTE: ${{ steps.signing.outputs.signing_note }}
          SPARKLE_NOTE: ${{ steps.sparkle.outputs.sparkle_note }}
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          artifacts_dir=".build/release-artifacts"
          notes_file="$RUNNER_TEMP/release-notes.md"
          draft="${PUBLISH_DRAFT:-false}"

          cat > "$notes_file" <<NOTES
          Spill $version for macOS.

          - Release notarization now uses App Store Connect API keys.
          - Current local token dashboard and AI metering updates are included.

          Download \`Spill-macos.dmg\` for standard installation.
          Signing: $SIGNING_NOTE
          Updates: $SPARKLE_NOTE
          NOTES

          assets=(
            "$artifacts_dir/Spill-macos.dmg"
            "$artifacts_dir/update.json"
            "$artifacts_dir/checksums.txt"
          )
          if [[ -f "$artifacts_dir/appcast.xml" ]]; then
            assets+=("$artifacts_dir/appcast.xml")
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Spill $version" --notes-file "$notes_file"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            if [[ "$draft" == "true" ]]; then
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --title "Spill $version" \
                --notes-file "$notes_file" \
                --draft \
                "${assets[@]}"
            else
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --title "Spill $version" \
                --notes-file "$notes_file" \
                "${assets[@]}"
            fi
          fi
