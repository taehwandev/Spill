name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        env:
          SPILL_APTABASE_APP_KEY: ${{ secrets.SPILL_APTABASE_APP_KEY }}
          SPILL_WEB_APTABASE_APP_KEY: ${{ secrets.SPILL_WEB_APTABASE_APP_KEY }}
          SPILL_INSTALLER_APTABASE_APP_KEY: ${{ secrets.SPILL_INSTALLER_APTABASE_APP_KEY }}
        run: ./scripts/prepare-docs.sh

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
