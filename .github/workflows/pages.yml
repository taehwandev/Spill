name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "Sources/Spill/Resources/adapters/**"
      - "scripts/prepare-docs.sh"
      - "scripts/spill-token-metering-setup.mjs"
      - "scripts/spill-codex-session-importer.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Prepare site
        env:
          SPILL_APTABASE_APP_KEY: ${{ secrets.SPILL_APTABASE_APP_KEY }}
          SPILL_WEB_APTABASE_APP_KEY: ${{ secrets.SPILL_WEB_APTABASE_APP_KEY }}
        run: ./scripts/prepare-docs.sh

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .build/docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
